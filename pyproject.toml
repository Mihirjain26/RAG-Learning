[project]
name = "langchain-by-krish-naik"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mihir Jain", email = "mihirjain9414@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "msoffcrypto-tool>=6.0.0",
    "onnxruntime==1.20.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pdfminer>=20191125",
    "pymupdf>=1.28.2",
    "pypdf>=6.18.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "tiktoken>=0.14.0",
    "unstructured[docx]>=0.27.5",
]

[project.scripts]
langchain-by-krish-naik = "langchain_by_krish_naik:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
